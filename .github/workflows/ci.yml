name: Salsa20-12 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Test ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [quarterround, rowround, columnround, core, state, cipher]

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Compile and test
        shell: bash
        run: |
          set -euo pipefail

          run_test() {
            label="$1"
            test_file="$2"
            shift 2

            for file in "$test_file" "$@"; do
              if [ ! -f "$file" ]; then
                echo "::error::$label: missing $file"
                echo "- FAILED: $label (missing $file)" >> "$GITHUB_STEP_SUMMARY"
                return 1
              fi
            done

            if [ "$test_file" = "tests/test_columnround.c" ]; then
              gcc -std=c11 -Wall -Wextra -Wpedantic -Werror -DUSE_MEMBER1 \
                -Iinclude "$@" "$test_file" -o unit_test
            else
              gcc -std=c11 -Wall -Wextra -Wpedantic -Werror \
                -Iinclude "$@" "$test_file" -o unit_test
            fi

            ./unit_test
            echo "- PASSED: $label" >> "$GITHUB_STEP_SUMMARY"
          }

          case "${{ matrix.module }}" in
            quarterround)
              run_test "Member 1 - Quarter Round" \
                tests/test_quarterround.c \
                src/quarterround.c
              ;;
            rowround)
              run_test "Member 2 - Row Round" \
                tests/test_rowround.c \
                src/quarterround.c src/rowround.c
              ;;
            columnround)
              run_test "Member 3 - Column Round" \
                tests/test_columnround.c \
                src/quarterround.c src/columnround.c
              ;;
            core)
              run_test "Member 4 - Core" \
                tests/test_core.c \
                src/quarterround.c src/rowround.c src/columnround.c \
                src/core.c src/state.c
              ;;
            state)
              for test_file in tests/test_state.c tests/test_spec.c tests/test_edge.c; do
                run_test "Member 5 - $test_file" "$test_file" src/state.c
              done
              ;;
            cipher)
              run_test "Member 6 - Cipher" \
                tests/test_cipher.c \
                src/quarterround.c src/rowround.c src/columnround.c \
                src/core.c src/state.c src/cipher.c
              ;;
          esac
